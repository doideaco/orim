<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orim Spike</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f4f2;
        --ink: #1f2430;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        font-family: -apple-system, "SF Pro Text", Inter, system-ui, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      #canvas { position: fixed; inset: 0; touch-action: none; }
      #overlay-root { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
      #hud {
        position: fixed; top: 12px; left: 12px; z-index: 10;
        background: rgba(255, 255, 255, 0.92);
        border: 1px solid rgba(0, 0, 0, 0.08);
        border-radius: 10px;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.08);
        padding: 10px 12px;
        font-size: 12.5px;
        line-height: 1.5;
        min-width: 200px;
        user-select: none;
      }
      #hud .row { display: flex; justify-content: space-between; gap: 12px; }
      #hud .row span:last-child { font-variant-numeric: tabular-nums; font-weight: 600; }
      #hud .buttons { display: flex; gap: 6px; margin-top: 8px; }
      #hud button {
        font: inherit; font-size: 12px;
        padding: 4px 10px;
        border-radius: 6px;
        border: 1px solid rgba(0, 0, 0, 0.15);
        background: #fff;
        cursor: pointer;
      }
      #hud button:hover { background: #f0f0ee; }
      #hud .hint { margin-top: 8px; color: #6b7280; font-size: 11.5px; }
      #status-dot {
        display: inline-block; width: 8px; height: 8px; border-radius: 50%;
        background: #d1d5db; margin-right: 5px;
      }
      #status-dot.connected { background: #22c55e; }
      .orim-text-editor {
        position: absolute;
        pointer-events: auto;
        transform-origin: top left;
      }
      .orim-text-editor .ProseMirror {
        width: 100%; height: 100%;
        padding: 12px;
        outline: 2px solid #4f7cff;
        border-radius: 6px;
        font-size: 15px;
        line-height: 1.35;
        white-space: pre-wrap;
        word-break: break-word;
        overflow: hidden;
      }
      .orim-text-editor .ProseMirror p { margin: 0; }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="overlay-root"></div>
    <div id="hud">
      <div class="row"><span><span id="status-dot"></span>sync</span><span id="stat-conn">off</span></div>
      <div class="row"><span>fps</span><span id="stat-fps">–</span></div>
      <div class="row"><span>nodes</span><span id="stat-nodes">0</span></div>
      <div class="row"><span>visible</span><span id="stat-visible">0</span></div>
      <div class="row"><span>zoom</span><span id="stat-zoom">100%</span></div>
      <div class="buttons">
        <button id="btn-seed">Seed 10k</button>
        <button id="btn-clear">Clear</button>
      </div>
      <div class="hint">
        double-click: new sticky · double-click sticky: edit<br />
        drag: pan / move · wheel: pan · ⌘/ctrl+wheel: zoom<br />
        click+delete: remove · ⌘Z undo
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
