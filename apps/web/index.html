<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Orim</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f4f2;
        --ink: #1f2430;
        --panel: rgba(255, 255, 255, 0.94);
        --border: rgba(0, 0, 0, 0.09);
        --shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        --accent: #4f7cff;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; }
      body {
        font-family: -apple-system, "SF Pro Text", Inter, system-ui, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }
      #canvas { position: fixed; inset: 0; touch-action: none; }
      #overlay-root { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

      .panel {
        position: fixed;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(10px);
      }

      #toolbar {
        left: 12px; top: 50%;
        transform: translateY(-50%);
        display: flex; flex-direction: column;
        padding: 6px;
        gap: 2px;
        z-index: 10;
      }
      #toolbar button {
        width: 38px; height: 38px;
        display: grid; place-items: center;
        border: none; border-radius: 8px;
        background: transparent;
        cursor: pointer;
        color: #40444f;
      }
      #toolbar button:hover { background: rgba(0, 0, 0, 0.06); }
      #toolbar button.active { background: var(--accent); color: #fff; }
      #toolbar svg { width: 19px; height: 19px; display: block; }
      #toolbar hr {
        border: none; border-top: 1px solid var(--border);
        margin: 4px 6px;
      }
      #swatch {
        width: 38px; height: 38px;
        display: grid; place-items: center;
        border: none; border-radius: 8px;
        background: transparent;
        cursor: pointer;
      }
      #swatch:hover { background: rgba(0, 0, 0, 0.06); }
      #swatch .chip {
        width: 20px; height: 20px;
        border-radius: 50%;
        border: 2.5px solid;
      }

      #color-popover {
        position: fixed;
        z-index: 20;
        padding: 10px;
        display: none;
      }
      #color-popover.open { display: block; }
      #popover-swatches {
        display: grid; grid-template-columns: repeat(3, 1fr);
        gap: 7px;
      }
      #popover-swatches button {
        width: 26px; height: 26px;
        border-radius: 50%;
        border: 2px solid;
        cursor: pointer;
      }
      #popover-swatches button.active { outline: 2px solid var(--accent); outline-offset: 2px; }
      #popover-fillstyles {
        display: flex; gap: 4px;
        margin-top: 10px;
        border-top: 1px solid var(--border);
        padding-top: 10px;
      }
      #popover-fillstyles button {
        flex: 1;
        font: inherit; font-size: 11.5px;
        padding: 4px 0;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #fff;
        color: #40444f;
        cursor: pointer;
      }
      #popover-fillstyles button.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }

      #exportbar {
        right: 12px; top: 12px;
        z-index: 10;
        padding: 4px;
      }
      #btn-export {
        display: flex; align-items: center; gap: 7px;
        font: inherit; font-size: 12.5px; font-weight: 500;
        border: none; background: transparent;
        border-radius: 8px;
        padding: 7px 11px;
        cursor: pointer;
        color: #40444f;
      }
      #btn-export:hover { background: rgba(0, 0, 0, 0.06); }
      #export-menu {
        position: fixed;
        right: 12px; top: 54px;
        z-index: 20;
        padding: 5px;
        display: none;
        min-width: 170px;
      }
      #export-menu.open { display: block; }
      #export-menu button {
        display: flex; justify-content: space-between; align-items: baseline;
        width: 100%;
        font: inherit; font-size: 12.5px;
        border: none; background: transparent;
        border-radius: 7px;
        padding: 7px 10px;
        cursor: pointer;
        color: #1f2430;
        text-align: left;
      }
      #export-menu button:hover { background: rgba(0, 0, 0, 0.06); }
      #export-menu button span { color: #9ca3af; font-size: 11px; margin-left: 16px; }

      #zoombar {
        right: 12px; bottom: 172px;
        display: flex; align-items: center;
        padding: 4px;
        gap: 2px;
        z-index: 10;
        font-size: 12px;
      }
      #zoombar button {
        font: inherit;
        border: none; background: transparent;
        border-radius: 6px;
        padding: 6px 9px;
        cursor: pointer;
        color: #40444f;
      }
      #zoombar button:hover { background: rgba(0, 0, 0, 0.06); }
      #zoom-label { min-width: 42px; text-align: center; font-variant-numeric: tabular-nums; }

      #minimap {
        right: 12px; bottom: 12px;
        z-index: 10;
        overflow: hidden;
        cursor: pointer;
      }
      #minimap canvas { display: block; }

      #logo {
        position: fixed;
        left: 18px; top: 16px;
        height: 21px;
        z-index: 10;
        user-select: none;
        pointer-events: none;
      }

      #statusbar {
        left: 12px; bottom: 12px;
        z-index: 10;
        padding: 6px 11px;
        font-size: 11.5px;
        color: #6b7280;
        display: flex; align-items: center; gap: 8px;
        user-select: none;
      }
      #status-dot {
        width: 7px; height: 7px; border-radius: 50%;
        background: #d1d5db;
      }
      #status-dot.connected { background: #22c55e; }
      #stat-fps { font-variant-numeric: tabular-nums; }

      .orim-text-editor {
        position: absolute;
        pointer-events: auto;
        transform-origin: top left;
        border-radius: 6px;
      }
      .orim-text-editor .ProseMirror {
        width: 100%; height: 100%;
        padding: 12px;
        outline: 2px solid var(--accent);
        border-radius: 6px;
        font-size: 15px;
        line-height: 1.35;
        white-space: pre-wrap;
        word-break: break-word;
        overflow: hidden;
      }
      .orim-text-editor .ProseMirror p { margin: 0; }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="overlay-root"></div>

    <img id="logo" src="/orim.svg" alt="Orim" />

    <div id="toolbar" class="panel">
      <button data-tool="select" title="Select — V"></button>
      <button data-tool="hand" title="Pan — H"></button>
      <hr />
      <button data-tool="sticky" title="Sticky note — N"></button>
      <button data-tool="rect" title="Rectangle — R"></button>
      <button data-tool="ellipse" title="Ellipse — O"></button>
      <button data-tool="diamond" title="Diamond — D"></button>
      <button data-tool="text" title="Text — T"></button>
      <button data-tool="frame" title="Frame — F"></button>
      <button data-tool="connector" title="Connector — C"></button>
      <button data-tool="ink" title="Pen — P"></button>
      <hr />
      <button id="swatch" title="Fill & stroke"><span class="chip"></span></button>
    </div>

    <div id="color-popover" class="panel">
      <div id="popover-swatches"></div>
      <div id="popover-fillstyles"></div>
    </div>

    <div id="exportbar" class="panel">
      <button id="btn-export">Export</button>
    </div>
    <div id="export-menu" class="panel">
      <button data-export="png">PNG <span>image</span></button>
      <button data-export="svg">SVG <span>vector</span></button>
      <button data-export="md">Markdown <span>outline</span></button>
      <button data-export="mermaid">Mermaid <span>diagram</span></button>
      <button data-export="json">JSON <span>orim format</span></button>
    </div>

    <div id="zoombar" class="panel">
      <button id="zoom-out" title="Zoom out">−</button>
      <span id="zoom-label">100%</span>
      <button id="zoom-in" title="Zoom in">+</button>
      <button id="zoom-fit" title="Zoom to fit — 1">Fit</button>
    </div>

    <div id="minimap" class="panel"><canvas id="minimap-canvas" width="200" height="140"></canvas></div>

    <div id="statusbar" class="panel">
      <span id="status-dot"></span>
      <span id="stat-conn">offline</span>
      <span>·</span>
      <span id="stat-fps">–</span><span>fps</span>
      <span>·</span>
      <span id="stat-nodes">0</span><span>objects</span>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
