# Orim — self-hosted deployment.
#   docker compose up -d       → http://localhost:1234
# Backup = copy the orim-data volume (a single SQLite file).
services:
  orim:
    # Published image; `docker compose build` rebuilds from source instead.
    image: ghcr.io/doideaco/orim:latest
    build: .
    ports:
      - "1234:1234"
    volumes:
      - orim-data:/data
    environment:
      # Where users reach Orim (needed for SSO redirects):
      # ORIM_PUBLIC_URL: https://orim.internal.example
      # Session lifetime (hours, default 720 = 30 days):
      # ORIM_SESSION_TTL_HOURS: "12"
      # OIDC single sign-on (optional; see SECURITY.md):
      # ORIM_OIDC_ISSUER: https://login.example.com/realms/main
      # ORIM_OIDC_CLIENT_ID: orim
      # ORIM_OIDC_CLIENT_SECRET: change-me
      # ORIM_OIDC_REQUIRED: "1"   # disable password auth entirely
      # Behind a reverse proxy, key rate limits on the real client IP:
      # ORIM_TRUST_PROXY: "1"
      # Allow other origins to call the API (default: same-origin only):
      # ORIM_CORS_ORIGINS: https://tools.internal.example
      # Hosts linked tables may pull CSV from (default: none — air-gapped):
      # ORIM_FETCH_ALLOW: docs.google.com,data.internal.example
      {}
    restart: unless-stopped

volumes:
  orim-data:
