# Every push and PR: typecheck all packages, run the conversion
# regression checks, and prove both apps still build.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm -r --if-present typecheck

      - name: Import inference regression (samples)
        run: node --import tsx scripts/check-samples.mjs
        working-directory: packages/convert

      - name: Table cell-CRDT regression
        run: node --import tsx scripts/check-table-crdt.mjs
        working-directory: packages/store

      - name: Miro importer regression
        run: node --import tsx scripts/check-miro.mjs
        working-directory: packages/convert

      - name: Spec generation stays in sync
        run: |
          node --import tsx scripts/generate-spec.mjs
          git diff --exit-code ../../docs/orim.schema.json
        working-directory: packages/schema

      - name: Build web app
        run: pnpm --dir apps/web build

      - name: Build sync server bundle
        run: pnpm --dir apps/sync build

      - name: Install Playwright browser
        run: pnpm --dir e2e exec playwright install --with-deps chromium

      - name: E2E (real server, built app, a11y mirror as oracle)
        run: pnpm --dir e2e test
